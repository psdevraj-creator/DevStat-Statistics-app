name: Release Desktop Edition

# On a version tag push (v*), build the Windows + macOS Desktop Edition
# (offline analysis engine + Chrome app-mode launcher) and publish the
# runnable installers as download-only release assets.
on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release shell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > RELEASE_BODY.md <<'EOF'
          # DevStat Desktop Edition

          Fully offline medical statistics, in your browser window (Chrome/Edge/Safari app mode — no address bar).

          - **Offline analysis** — the statistics engine runs entirely on your machine. Your data never leaves it.
          - **Register / subscription online** — sign in, register and upgrade through the normal DevStat account (works on the online app too).
          - **Free 5 analyses + 5 charts** per account, then a £25/year licence.

          > ⚠️ **Not code-signed.** It's clean, but Windows may show SmartScreen and macOS may show Gatekeeper because there is no paid signing certificate.
          > - **Windows**: click **More info → Run anyway**.
          > - **macOS**: right-click the app → **Open**, then **Open** again.

          Download the zip for your system below. Extract anywhere, then double-click **DevStatDesktopLauncher** (Windows) or **DevStat Desktop Edition.app** (macOS).
          EOF
          gh release create "$GITHUB_REF_NAME" --title "DevStat Desktop Edition $GITHUB_REF_NAME" --notes-file RELEASE_BODY.md || echo "release already exists"

  installer:
    needs: release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build frontend SPA (backend/static)
        working-directory: frontend
        run: npm install && npm run build

      - name: Install backend deps
        run: pip install -r requirements.txt pyinstaller

      - name: Bundle engine
        working-directory: backend
        run: python -m PyInstaller devstat_engine.spec --noconfirm

      - name: Bundle launcher
        working-directory: desktop
        run: python -m PyInstaller launcher.spec --noconfirm

      - name: Package Windows zip
        run: python desktop/package.py --os win --engine-dir backend/dist/DevStatEngine --launcher desktop/dist/DevStatDesktopLauncher.exe --out desktop/release

      - name: Upload artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" desktop/release/DevStat-Desktop-win.zip --clobber

  installer-mac:
    needs: release
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build frontend SPA (backend/static)
        working-directory: frontend
        run: npm install && npm run build

      - name: Install backend deps
        run: pip install -r requirements.txt pyinstaller

      - name: Bundle engine
        working-directory: backend
        run: python -m PyInstaller devstat_engine.spec --noconfirm

      - name: Bundle launcher
        working-directory: desktop
        run: python -m PyInstaller launcher.spec --noconfirm

      - name: Package macOS .app zip
        run: python desktop/package.py --os mac --engine-dir backend/dist/DevStatEngine --launcher desktop/dist/DevStatDesktopLauncher --out desktop/release

      - name: Upload artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" desktop/release/DevStat-Desktop-mac.zip --clobber
