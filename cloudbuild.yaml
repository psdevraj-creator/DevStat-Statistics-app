steps:
- name: 'gcr.io/cloud-builders/docker'
  args: ['build', '-t', 'gcr.io/$PROJECT_ID/devstat', '.']
- name: 'gcr.io/cloud-builders/gcloud'
  args: ['run', 'deploy', 'devstat', '--image', 'gcr.io/$PROJECT_ID/devstat', '--region', 'us-central1', '--allow-unauthenticated']
images:
- 'gcr.io/$PROJECT_ID/devstat'
